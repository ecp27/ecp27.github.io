<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Application review · European Coaching Program</title>
  <script>
    if (location.pathname.endsWith("/applications")) {
      location.replace(location.pathname + "/" + location.search + location.hash);
    }
  </script>
  <link rel="stylesheet" href="../assets/css/site.css">
  <style>
    .review-access {
      width: min(29rem, calc(100% - 2rem));
      margin: clamp(2rem, 9vh, 6rem) auto;
      padding: clamp(1.5rem, 5vw, 2.75rem);
      border: 1px solid var(--line);
      border-top: 4px solid var(--accent);
    }
    .review-access h1 { margin: 0 0 1.75rem; font-size: clamp(1.75rem, 5vw, 2.25rem); line-height: 1.2; }
    .review-access label { font-size: 1rem; }
    .field-label { display: block; font-weight: 650; margin-bottom: .4rem; }
    .password-field { display: flex; border: 1px solid var(--muted); border-radius: 3px; }
    .password-field:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
    .password-field input { width: 100%; min-width: 0; padding: .65rem; border: 0; outline: 0; font: inherit; }
    .password-field button { padding: 0 .8rem; background: transparent; color: var(--accent); }
    .review-access button { border: 0; font: inherit; font-weight: 650; cursor: pointer; }
    .review-access :is(button, input[type="checkbox"]):focus-visible { outline: 3px solid var(--highlight); outline-offset: 2px; }
    .remember { display: flex; gap: .6rem; align-items: center; margin: 1rem 0 1.5rem; }
    .remember input { margin: 0; width: 1rem; height: 1rem; accent-color: var(--accent); }
    .unlock { width: 100%; padding: .75rem; background: var(--accent); color: white; border-radius: 3px; }
    .unlock:hover { background: var(--ink); }
    #error { font-size: 1rem; color: #8a2525; }
    #error:empty { display: none; }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../"><span class="brand-mark">ECP</span> European Coaching Program</a>
  </header>
  <main class="review-access">
    <h1>Application review</h1>
    <form id="unlock" hidden>
      <label class="field-label" for="password">Reviewer passphrase</label>
      <div class="password-field">
        <input id="password" type="password" autocomplete="current-password" required>
        <button id="toggle" type="button" aria-label="Show passphrase" aria-controls="password">Show</button>
      </div>
      <label class="remember"><input id="remember" type="checkbox"> /*[|template_remember|]*/0</label>
      <p id="error" role="alert"></p>
      <button class="unlock" type="submit">Open applications</button>
    </form>
    <noscript>Enable JavaScript to unlock the applications.</noscript>
  </main>
  <script>
    const engine = /*[|js_staticrypt|]*/ 0;
    const viewer = engine.init(/*[|staticrypt_config|]*/ 0, {
      rememberExpirationKey: "staticrypt_expiration",
      rememberPassphraseKey: "staticrypt_passphrase",
      replaceHtmlCallback: null,
      clearLocalStorageCallback: null
    });
    const form = document.getElementById("unlock");
    const password = document.getElementById("password");
    const toggle = document.getElementById("toggle");

    window.addEventListener("load", async () => {
      if (!(await viewer.handleDecryptOnLoad()).isSuccessful) {
        form.hidden = false;
        password.focus();
      }
    });
    toggle.addEventListener("click", () => {
      const show = password.type === "password";
      password.type = show ? "text" : "password";
      toggle.textContent = show ? "Hide" : "Show";
      toggle.setAttribute("aria-label", toggle.textContent + " passphrase");
    });
    form.addEventListener("submit", async event => {
      event.preventDefault();
      const remember = document.getElementById("remember").checked;
      if (!(await viewer.handleDecryptionOfPage(password.value, remember)).isSuccessful) {
        document.getElementById("error").textContent = "That passphrase didn’t unlock the applications. Try again.";
        password.select();
      }
    });
  </script>
</body>
</html>
