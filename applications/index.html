      border-top: 4px solid var(--accent);

    .field-label { display: block; font-weight: 650; margin-bottom: .4rem; }

    .unlock { width: 100%; padding: .75rem; background: var(--accent); color: white; border-radius: 3px; }
    .unlock:hover { background: var(--ink); }
    #error { font-size: 1rem; color: #8a2525; }
