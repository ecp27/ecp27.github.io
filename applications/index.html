      border-top: 4px solid var(--accent);

    .field-label { display: block; font-weight: 650; margin-bottom: .4rem; }
    .password-field { display: flex; border: 1px solid var(--muted); border-radius: 3px; }

    .password-field button { padding: 0 .8rem; background: transparent; color: var(--accent); }
    .review-access button { border: 0; font: inherit; font-weight: 650; cursor: pointer; }

    .remember input { margin: 0; width: 1rem; height: 1rem; accent-color: var(--accent); }
    .unlock { width: 100%; padding: .75rem; background: var(--accent); color: white; border-radius: 3px; }
    .unlock:hover { background: var(--ink); }
    #error { font-size: 1rem; color: #8a2525; }
    #error:empty { display: none; }
